<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bellman-Ford Algorithm — Interactive Walkthrough</title>
<style>
  :root {
    --bg-primary: #ffffff;
    --bg-secondary: #f5f4ef;
    --text-primary: #1a1a1a;
    --text-secondary: #6b6b6b;
    --border: rgba(0, 0, 0, 0.15);
    --node-stroke: #888780;
    --edge-color: #B4B2A9;
    --active-color: #BA7517;
    --visited-fill: #9FE1CB;
    --visited-stroke: #0F6E56;
    --visited-text: #04342C;
    --current-fill: #FAC775;
    --current-stroke: #854F0B;
    --current-text: #412402;
    --row-visited-bg: #E1F5EE;
    --row-visited-text: #04342C;
    --row-current-bg: #FAEEDA;
    --row-current-text: #854F0B;
    --negative-color: #993556;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-primary: #1e1e1e;
      --bg-secondary: #2a2a2a;
      --text-primary: #e8e8e8;
      --text-secondary: #a8a8a8;
      --border: rgba(255, 255, 255, 0.15);
      --node-stroke: #B4B2A9;
      --edge-color: #888780;
      --visited-fill: #085041;
      --visited-stroke: #5DCAA5;
      --visited-text: #9FE1CB;
      --current-fill: #633806;
      --current-stroke: #EF9F27;
      --current-text: #FAC775;
      --row-visited-bg: #085041;
      --row-visited-text: #9FE1CB;
      --row-current-bg: #633806;
      --row-current-text: #FAC775;
      --negative-color: #ED93B1;
    }
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    padding: 24px 20px;
    margin: 0;
    line-height: 1.5;
  }

  .container { max-width: 700px; margin: 0 auto; }

  .info {
    background: var(--bg-secondary);
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 1rem;
    min-height: 64px;
  }
  .title { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
  .narr { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

  svg { width: 100%; height: auto; display: block; }

  table {
    width: 100%;
    font-size: 13px;
    margin-top: 16px;
    border-collapse: collapse;
    table-layout: fixed;
  }
  th, td {
    padding: 8px 6px;
    text-align: center;
    border-bottom: 0.5px solid var(--border);
  }
  th {
    font-weight: 500;
    color: var(--text-secondary);
    font-size: 12px;
  }
  td.v { background: var(--row-visited-bg); color: var(--row-visited-text); }
  td.c { background: var(--row-current-bg); color: var(--row-current-text); font-weight: 500; }

  .ctrl {
    display: flex;
    gap: 8px;
    margin-top: 1rem;
    align-items: center;
    flex-wrap: wrap;
  }
  button {
    font-family: inherit;
    font-size: 13px;
    padding: 8px 14px;
    background: transparent;
    color: var(--text-primary);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
  }
  button:hover:not(:disabled) { background: var(--bg-secondary); }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .ctr {
    margin-left: auto;
    font-size: 13px;
    color: var(--text-secondary);
  }
</style>
</head>
<body>
<div class="container">
  <div class="info">
    <div class="title" id="bf-title">Step 1 — Initialize</div>
    <div class="narr" id="bf-narr">All distances set to ∞ except start (A = 0). Notice edge B→C has a negative weight (−1). Bellman-Ford handles this; Dijkstra cannot.</div>
  </div>

  <svg id="bf-svg" viewBox="0 0 600 400">
    <defs>
      <marker id="arrow-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--edge-color)"/>
      </marker>
      <marker id="arrow-active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--active-color)"/>
      </marker>
    </defs>
    <g id="bf-edges"></g>
    <g id="bf-nodes"></g>
  </svg>

  <table>
    <thead>
      <tr>
        <th style="width: 60px;">dist</th>
        <th>A</th><th>B</th><th>C</th><th>D</th><th>E</th>
      </tr>
    </thead>
    <tbody>
      <tr id="bf-row"></tr>
    </tbody>
  </table>

  <div class="ctrl">
    <button id="bf-prev">← Previous</button>
    <button id="bf-next">Next →</button>
    <button id="bf-reset">Reset</button>
    <span class="ctr" id="bf-counter">Step 1 / 6</span>
  </div>
</div>

<script>
  const bfNodes = {
    A: { x: 70,  y: 200 },
    B: { x: 220, y: 90  },
    C: { x: 220, y: 310 },
    D: { x: 400, y: 200 },
    E: { x: 540, y: 200 }
  };

  const bfEdges = [
    { from: 'A', to: 'B', w: 5 },
    { from: 'A', to: 'C', w: 7 },
    { from: 'B', to: 'C', w: -1 },
    { from: 'C', to: 'D', w: 3 },
    { from: 'D', to: 'E', w: 2 }
  ];

  const bfSteps = [
    {
      title: "Step 1 — Initialize",
      narr: "All distances set to ∞ except start (A = 0). Notice edge B→C has a negative weight (−1). Bellman-Ford handles this; Dijkstra cannot.",
      d: { A: 0, B: Infinity, C: Infinity, D: Infinity, E: Infinity },
      v: [],
      c: [],
      ae: []
    },
    {
      title: "Iteration 1 — Relax all 5 edges",
      narr: "Process every edge once. Only edges from A succeed (others have an ∞ source). A→B updates B=5. A→C updates C=7.",
      d: { A: 0, B: 5, C: 7, D: Infinity, E: Infinity },
      v: ['A'],
      c: ['B', 'C'],
      ae: ['A->B', 'A->C']
    },
    {
      title: "Iteration 2 — Relax all 5 edges",
      narr: "B→C improves C from 7 to 4 (via 5−1, the negative edge helps!). C→D sets D = 7+3 = 10 (using C's old value of 7 in this pass).",
      d: { A: 0, B: 5, C: 4, D: 10, E: Infinity },
      v: ['A', 'B'],
      c: ['C', 'D'],
      ae: ['B->C', 'C->D']
    },
    {
      title: "Iteration 3 — Relax all 5 edges",
      narr: "C→D improves D from 10 to 7 (since C dropped to 4 last round). D→E sets E = 10+2 = 12.",
      d: { A: 0, B: 5, C: 4, D: 7, E: 12 },
      v: ['A', 'B', 'C'],
      c: ['D', 'E'],
      ae: ['C->D', 'D->E']
    },
    {
      title: "Iteration 4 — Relax all 5 edges",
      narr: "D→E improves E from 12 to 9 (since D dropped to 7). With 5 nodes we need V−1 = 4 iterations max.",
      d: { A: 0, B: 5, C: 4, D: 7, E: 9 },
      v: ['A', 'B', 'C', 'D'],
      c: ['E'],
      ae: ['D->E']
    },
    {
      title: "Step 6 — Negative cycle check. Done!",
      narr: "Run one more pass. No distance improves → no negative cycle. Final shortest paths from A: A=0, B=5, C=4, D=7, E=9.",
      d: { A: 0, B: 5, C: 4, D: 7, E: 9 },
      v: ['A', 'B', 'C', 'D', 'E'],
      c: [],
      ae: []
    }
  ];

  let bfStep = 0;
  const ek = (from, to) => `${from}->${to}`;

  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function bfDraw() {
    const s = bfSteps[bfStep];
    const active = new Set(s.ae);
    const eg = document.getElementById('bf-edges');
    const ng = document.getElementById('bf-nodes');
    eg.innerHTML = '';
    ng.innerHTML = '';

    const edgeColor = cssVar('--edge-color');
    const activeColor = cssVar('--active-color');
    const negativeColor = cssVar('--negative-color');
    const bgPrimary = cssVar('--bg-primary');
    const textPrimary = cssVar('--text-primary');
    const textSecondary = cssVar('--text-secondary');
    const nodeStroke = cssVar('--node-stroke');
    const R = 22;

    bfEdges.forEach(e => {
      const n1 = bfNodes[e.from], n2 = bfNodes[e.to];
      const dx = n2.x - n1.x, dy = n2.y - n1.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      const ux = dx / d, uy = dy / d;
      const sx = n1.x + R * ux, sy = n1.y + R * uy;
      const ex = n2.x - R * ux, ey = n2.y - R * uy;

      const isActive = active.has(ek(e.from, e.to));
      const stroke = isActive ? activeColor : edgeColor;
      const sw = isActive ? 2.5 : 1.5;
      const marker = isActive ? 'url(#arrow-active)' : 'url(#arrow-default)';

      eg.innerHTML += `<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${stroke}" stroke-width="${sw}" marker-end="${marker}"/>`;

      const mx = (n1.x + n2.x) / 2, my = (n1.y + n2.y) / 2;
      const isNeg = e.w < 0;
      const weightColor = isNeg ? negativeColor : textPrimary;
      const weightStroke = isNeg ? negativeColor : stroke;
      eg.innerHTML += `<circle cx="${mx}" cy="${my}" r="13" fill="${bgPrimary}" stroke="${weightStroke}" stroke-width="1"/>`;
      eg.innerHTML += `<text x="${mx}" y="${my}" text-anchor="middle" dy="4" font-size="12" font-weight="500" fill="${weightColor}">${e.w}</text>`;
    });

    Object.keys(bfNodes).forEach(name => {
      const n = bfNodes[name];
      const isCur = s.c.includes(name);
      const isVis = s.v.includes(name);
      let fill, stroke, tc;
      if (isCur) {
        fill = cssVar('--current-fill');
        stroke = cssVar('--current-stroke');
        tc = cssVar('--current-text');
      } else if (isVis) {
        fill = cssVar('--visited-fill');
        stroke = cssVar('--visited-stroke');
        tc = cssVar('--visited-text');
      } else {
        fill = bgPrimary;
        stroke = nodeStroke;
        tc = textPrimary;
      }
      const dv = s.d[name];
      const dl = dv === Infinity ? '∞' : String(dv);
      ng.innerHTML += `<g>
        <circle cx="${n.x}" cy="${n.y}" r="${R}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>
        <text x="${n.x}" y="${n.y}" text-anchor="middle" dy="5" font-size="16" font-weight="500" fill="${tc}">${name}</text>
        <text x="${n.x}" y="${n.y - 32}" text-anchor="middle" font-size="13" font-weight="500" fill="${textSecondary}">d=${dl}</text>
      </g>`;
    });
  }

  function bfUpdate() {
    const s = bfSteps[bfStep];
    document.getElementById('bf-title').textContent = s.title;
    document.getElementById('bf-narr').textContent = s.narr;
    document.getElementById('bf-counter').textContent = `Step ${bfStep + 1} / ${bfSteps.length}`;

    const row = document.getElementById('bf-row');
    row.innerHTML = '<td style="color: var(--text-secondary);">from A</td>';
    ['A', 'B', 'C', 'D', 'E'].forEach(n => {
      const d = s.d[n];
      let cls = '';
      if (s.c.includes(n)) cls = 'c';
      else if (s.v.includes(n)) cls = 'v';
      row.innerHTML += `<td class="${cls}">${d === Infinity ? '∞' : d}</td>`;
    });

    document.getElementById('bf-prev').disabled = bfStep === 0;
    document.getElementById('bf-next').disabled = bfStep === bfSteps.length - 1;
    bfDraw();
  }

  document.getElementById('bf-next').addEventListener('click', () => {
    if (bfStep < bfSteps.length - 1) { bfStep++; bfUpdate(); }
  });
  document.getElementById('bf-prev').addEventListener('click', () => {
    if (bfStep > 0) { bfStep--; bfUpdate(); }
  });
  document.getElementById('bf-reset').addEventListener('click', () => {
    bfStep = 0; bfUpdate();
  });

  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'ArrowRight' && bfStep < bfSteps.length - 1) { bfStep++; bfUpdate(); }
    else if (ev.key === 'ArrowLeft' && bfStep > 0) { bfStep--; bfUpdate(); }
  });

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', bfDraw);

  bfUpdate();
</script>
</body>
</html>
